services:
  backend:
    build: ./backend
    container_name: backend-app
    image: backendkntl
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      APP_PORT: ${APP_PORT}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
    depends_on:
      - mysql-db
      - redis-cache

  mysql:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_LOCAL_PORT}:${DB_PORT}"
    volumes:
      - mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-app
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: ${DB_HOST}

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "${REDIS_LOCAL_PORT}:${REDIS_PORT}"

volumes:
  mysql-data: